name: Backend Tests

on:
  push:
    branches:
      - main
      - master
    paths:
      - "school-mgmt/backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "school-mgmt/backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: school-mgmt/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: school-mgmt/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Run e2e tests
        run: npm run test:e2e
